<!DOCTYPE html>
<html>
<head>
    <title>Smart Agriculture Project</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>
    <h1>Smart Agriculture Project</h1>

    <div class="form-box">
        <label>Seed Image:</label>
        <input type="file" id="seed_image" accept="image/*">
        <button onclick="analyzeSeed()">Analyze Seed</button>
        <p>Crop Type: <span id="crop_type_display">Not analyzed yet</span></p>
        <p>Seed Quality: <span id="seed_quality_display">Not analyzed yet</span></p>

        <label>Soil Moisture:</label>
        <button onclick="readSensor()">Read from Sensor</button>
        <p>Current Reading: <span id="moisture_display">Not read yet</span></p>

        <button onclick="runPrediction()">Predict</button>
        <button onclick="runComparison()">Compare All Soils</button>
    </div>

    <div id="results" class="results-box" style="display:none;">
        <h3>Results</h3>
        <p><b>Recommended Soil:</b> <span id="rec_soil"></span></p>
        <p><b>Suitability Score:</b> <span id="rec_score"></span></p>
        <p><b>Reason:</b> <span id="rec_reason"></span></p>
        <p><b>Predicted Yield:</b> <span id="pred_yield"></span> kg/ha</p>
        <p><b>Harvest Days:</b> <span id="pred_days"></span></p>

        <canvas id="growthChart" width="500" height="300"></canvas>
    </div>

    <div id="comparison_results" class="results-box" style="display:none;">
        <h3>Soil Comparison</h3>
        <canvas id="yieldCompareChart" width="500" height="250"></canvas>
        <canvas id="growthCompareChart" width="500" height="300"></canvas>
    </div>

    <p id="error_msg" style="color:red;"></p>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
